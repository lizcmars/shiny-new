<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camp Site Usage Planner</title>
  <style>
    /* ── Reset & Base ────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #f4f7fb;
      --surface:   #ffffff;
      --border:    #d1d9e6;
      --text:      #1e2a3a;
      --muted:     #6b7a95;
      --primary:   #2563eb;
      --primary-h: #1d4ed8;
      --danger:    #dc2626;
      --warning:   #f59e0b;
      --success:   #16a34a;
      --shadow:    0 2px 8px rgba(0,0,0,.08);
      --radius:    8px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      background: var(--primary);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
    }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -.3px; }
    header .sub { font-size: .8rem; opacity: .8; }
    header .spacer { flex: 1; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius);
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background .15s, opacity .15s;
    }
    .btn-white {
      background: rgba(255,255,255,.18);
      color: #fff;
      border: 1px solid rgba(255,255,255,.35);
    }
    .btn-white:hover { background: rgba(255,255,255,.28); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-h); }
    .btn-danger  { background: var(--danger); color: #fff; }
    .btn-danger:hover  { opacity: .88; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { opacity: .88; }
    .btn-sm { padding: 4px 10px; font-size: .75rem; }

    /* ── Layout ──────────────────────────────────────────────── */
    .layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 0;
      height: calc(100vh - 54px);
    }

    /* ── Sidebar ─────────────────────────────────────────────── */
    aside {
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .panel-title {
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .tag-list { display: flex; flex-direction: column; gap: 5px; }
    .tag-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: .82rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background .12s;
    }
    .tag-row:hover { background: var(--bg); }
    .tag-row.active { border-color: var(--border); background: var(--bg); }
    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .tag-name { flex: 1; font-weight: 500; }
    .tag-count {
      font-size: .72rem;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1px 6px;
    }
    .tag-del {
      opacity: 0;
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: .9rem;
      line-height: 1;
      padding: 0 2px;
    }
    .tag-row:hover .tag-del { opacity: 1; }
    .add-inline {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .add-inline input {
      flex: 1;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: .8rem;
      outline: none;
    }
    .add-inline input:focus { border-color: var(--primary); }

    /* site list in sidebar */
    .site-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      font-size: .82rem;
      border-radius: 6px;
    }
    .site-item:hover { background: var(--bg); }
    .site-icon { font-size: 1rem; }
    .site-name { flex: 1; }

    /* legend / stats */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      text-align: center;
    }
    .stat-val { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
    .stat-lbl { font-size: .7rem; color: var(--muted); }

    /* conflict list */
    .conflict-item {
      font-size: .75rem;
      background: #fef9c3;
      border: 1px solid #fde68a;
      border-radius: 5px;
      padding: 6px 8px;
      color: #713f12;
      margin-bottom: 4px;
    }

    /* ── Main Grid Area ──────────────────────────────────────── */
    main {
      overflow: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      box-shadow: var(--shadow);
    }
    .toolbar select, .toolbar input[type="text"], .toolbar input[type="date"] {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: .82rem;
      outline: none;
      background: var(--bg);
    }
    .toolbar select:focus,
    .toolbar input:focus { border-color: var(--primary); background: #fff; }
    .toolbar label { font-size: .8rem; color: var(--muted); font-weight: 500; }
    .sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

    /* grid wrapper */
    .grid-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: auto;
    }
    table {
      border-collapse: collapse;
      min-width: 100%;
      font-size: .8rem;
    }
    th, td {
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    /* header rows */
    thead th {
      background: #f0f4fa;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      padding: 6px 10px;
      position: sticky;
      top: 0;
      z-index: 3;
    }
    thead tr:first-child th {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      padding: 4px 10px;
    }

    /* site header column */
    .col-site {
      position: sticky;
      left: 0;
      z-index: 4;
      background: #f0f4fa;
      min-width: 130px;
      max-width: 160px;
      font-weight: 700;
      text-align: left;
      padding: 6px 10px;
    }
    thead .col-site { z-index: 5; }

    /* body rows */
    tbody tr:hover td { background: #f8faff; }
    tbody tr:hover td.col-site { background: #edf2ff; }

    /* cells */
    .cell {
      min-width: 90px;
      max-width: 120px;
      height: 44px;
      padding: 0;
      cursor: pointer;
      position: relative;
      vertical-align: middle;
      text-align: center;
    }
    .cell:hover .cell-bg { opacity: .12 !important; }
    .cell-bg {
      position: absolute; inset: 2px;
      border-radius: 5px;
      pointer-events: none;
    }
    .cell-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 3px 4px;
      gap: 1px;
    }
    .cell-group {
      font-weight: 700;
      font-size: .72rem;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cell-activity {
      font-size: .65rem;
      color: var(--muted);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cell.conflict { outline: 2px solid var(--warning); outline-offset: -2px; }
    .empty-cell { color: #ccc; font-size: 1rem; }

    /* session row labels */
    .session-label {
      font-size: .68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--muted);
      padding: 4px 10px;
      background: #f8f9fc;
    }

    /* ── Modal ───────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      animation: fadeIn .15s ease;
    }
    @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
    .modal {
      background: var(--surface);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      width: 420px;
      max-width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp .18s ease;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity:0 } to { transform: none; opacity:1 } }
    .modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h2 { font-size: 1rem; font-weight: 700; flex: 1; }
    .modal-close {
      background: none; border: none;
      font-size: 1.3rem; color: var(--muted);
      cursor: pointer; line-height: 1; padding: 2px;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex; gap: 8px; justify-content: flex-end;
    }
    .form-row { display: flex; flex-direction: column; gap: 4px; }
    .form-label {
      font-size: .78rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .5px;
    }
    .form-control {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: .85rem;
      outline: none;
      width: 100%;
    }
    .form-control:focus { border-color: var(--primary); }
    .form-hint { font-size: .72rem; color: var(--muted); }

    .info-row {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: .8rem;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 12px;
    }
    .info-row .lbl { color: var(--muted); font-weight: 600; }

    /* toast */
    #toast {
      position: fixed;
      bottom: 20px; right: 20px;
      background: #1e2a3a;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: .82rem;
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    #toast.show { opacity: 1; }

    /* print */
    @media print {
      aside, .toolbar, header .btn { display: none !important; }
      .layout { display: block; }
      main { padding: 0; overflow: visible; }
      .grid-wrap { box-shadow: none; border: none; overflow: visible; }
      table { font-size: .7rem; }
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #c4cdd9; border-radius: 3px; }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div>
    <h1>⛺ Camp Site Usage Planner</h1>
    <div class="sub">Interactive scheduling for summer camp facilities</div>
  </div>
  <div class="spacer"></div>
  <button class="btn btn-white" onclick="exportCSV()">&#8681; Export CSV</button>
  <button class="btn btn-white" onclick="window.print()">&#128438; Print</button>
  <button class="btn btn-white" onclick="resetAll()" title="Clear all bookings">&#8635; Reset</button>
</header>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <aside>

    <!-- Stats -->
    <div>
      <div class="panel-title">Overview</div>
      <div class="stat-grid" id="stats"></div>
    </div>

    <!-- Groups -->
    <div>
      <div class="panel-title">Camp Groups</div>
      <div class="tag-list" id="groupList"></div>
      <div class="add-inline">
        <input id="newGroupName" placeholder="New group name…" maxlength="28" />
        <button class="btn btn-primary btn-sm" onclick="addGroup()">Add</button>
      </div>
    </div>

    <!-- Sites -->
    <div>
      <div class="panel-title">Sites / Facilities</div>
      <div id="siteList" class="tag-list"></div>
      <div class="add-inline">
        <input id="newSiteName" placeholder="New site name…" maxlength="28" />
        <button class="btn btn-primary btn-sm" onclick="addSite()">Add</button>
      </div>
    </div>

    <!-- Conflicts -->
    <div>
      <div class="panel-title">Scheduling Conflicts</div>
      <div id="conflictList"><div style="font-size:.75rem;color:var(--muted)">No conflicts detected.</div></div>
    </div>

  </aside>

  <!-- MAIN -->
  <main>
    <div class="toolbar">
      <label>Week start:</label>
      <input type="date" id="weekStart" />
      <label>Weeks:</label>
      <select id="numWeeks">
        <option value="1">1 week</option>
        <option value="2">2 weeks</option>
        <option value="4" selected>4 weeks</option>
        <option value="6">6 weeks</option>
        <option value="8">8 weeks</option>
        <option value="10">10 weeks</option>
      </select>
      <div class="sep"></div>
      <label>Filter group:</label>
      <select id="filterGroup">
        <option value="">All groups</option>
      </select>
      <label>Filter site:</label>
      <select id="filterSite">
        <option value="">All sites</option>
      </select>
      <div class="sep"></div>
      <button class="btn btn-primary btn-sm" onclick="renderGrid()">Refresh</button>
    </div>

    <div class="grid-wrap">
      <table id="grid"></table>
    </div>
  </main>
</div>

<!-- CELL MODAL -->
<div id="cellModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Schedule Slot</h2>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="info-row" id="slotInfo"></div>
      <div class="form-row">
        <div class="form-label">Camp Group</div>
        <select id="modalGroup" class="form-control">
          <option value="">(empty — clear slot)</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-label">Activity / Notes</div>
        <input id="modalActivity" class="form-control" placeholder="e.g. Swimming, Archery, Free time…" maxlength="50" />
        <div class="form-hint">Optional — appears below the group name in the cell.</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="modalClear" onclick="clearSlot()">Clear Slot</button>
      <button class="btn btn-primary" onclick="saveSlot()">Save</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════ */
const SESSIONS = ["Morning", "Afternoon", "Evening"];
const DAY_LABELS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const PALETTE = [
  "#2563eb","#7c3aed","#db2777","#ea580c","#16a34a",
  "#0891b2","#d97706","#4f46e5","#be185d","#15803d",
  "#0369a1","#9333ea","#b45309","#0f766e","#c2410c"
];

let state = loadState();

function defaultState() {
  const monday = getComingMonday();
  return {
    weekStart: monday,
    numWeeks: 4,
    groups: [
      { id: uid(), name: "Bears",    color: PALETTE[0] },
      { id: uid(), name: "Eagles",   color: PALETTE[1] },
      { id: uid(), name: "Wolves",   color: PALETTE[2] },
      { id: uid(), name: "Foxes",    color: PALETTE[3] },
      { id: uid(), name: "Otters",   color: PALETTE[4] },
    ],
    sites: [
      { id: uid(), name: "Dining Hall",     icon: "🍽️" },
      { id: uid(), name: "Cabin Row A",     icon: "🛖" },
      { id: uid(), name: "Cabin Row B",     icon: "🛖" },
      { id: uid(), name: "Sports Field",    icon: "⚽" },
      { id: uid(), name: "Swimming Pool",   icon: "🏊" },
      { id: uid(), name: "Arts & Crafts",   icon: "🎨" },
      { id: uid(), name: "Nature Trail",    icon: "🌲" },
      { id: uid(), name: "Amphitheater",    icon: "🎭" },
    ],
    // bookings: { "siteId|dayIndex|session": { groupId, activity } }
    bookings: {}
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem("campPlanner");
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return defaultState();
}

function saveState() {
  localStorage.setItem("campPlanner", JSON.stringify(state));
}

/* ═══════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════ */
function uid() {
  return Math.random().toString(36).slice(2, 9);
}
function getComingMonday() {
  const d = new Date();
  const day = d.getDay(); // 0=Sun
  const diff = day === 0 ? 1 : (8 - day) % 7 || 7;
  d.setDate(d.getDate() + (diff === 7 ? 0 : diff));
  return d.toISOString().slice(0, 10);
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d;
}
function fmtDate(d) {
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function slotKey(siteId, dayIdx, session) {
  return `${siteId}|${dayIdx}|${session}`;
}
function groupById(id) {
  return state.groups.find(g => g.id === id);
}
function siteById(id) {
  return state.sites.find(s => s.id === id);
}
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

/* ═══════════════════════════════════════════════════
   SIDEBAR — GROUPS
═══════════════════════════════════════════════════ */
function renderGroups() {
  const el = document.getElementById("groupList");
  el.innerHTML = "";
  state.groups.forEach(g => {
    const row = document.createElement("div");
    row.className = "tag-row";
    row.innerHTML = `
      <div class="dot" style="background:${g.color}"></div>
      <span class="tag-name">${escHtml(g.name)}</span>
      <span class="tag-count">${countGroupBookings(g.id)}</span>
      <button class="tag-del" title="Delete group" onclick="deleteGroup('${g.id}')">&#x2715;</button>
    `;
    el.appendChild(row);
  });

  // Update filter dropdown
  const fg = document.getElementById("filterGroup");
  const fgVal = fg.value;
  fg.innerHTML = '<option value="">All groups</option>';
  state.groups.forEach(g => {
    const o = document.createElement("option");
    o.value = g.id; o.textContent = g.name;
    fg.appendChild(o);
  });
  fg.value = fgVal;
}

function countGroupBookings(gid) {
  return Object.values(state.bookings).filter(b => b.groupId === gid).length;
}

function addGroup() {
  const inp = document.getElementById("newGroupName");
  const name = inp.value.trim();
  if (!name) return;
  const color = PALETTE[state.groups.length % PALETTE.length];
  state.groups.push({ id: uid(), name, color });
  inp.value = "";
  saveState(); renderSidebar(); renderGrid();
  toast(`Group "${name}" added.`);
}

function deleteGroup(id) {
  const g = groupById(id);
  if (!g) return;
  if (!confirm(`Delete group "${g.name}"? All bookings for this group will be cleared.`)) return;
  state.groups = state.groups.filter(x => x.id !== id);
  Object.keys(state.bookings).forEach(k => {
    if (state.bookings[k].groupId === id) delete state.bookings[k];
  });
  saveState(); renderSidebar(); renderGrid();
  toast(`Group "${g.name}" deleted.`);
}

/* ═══════════════════════════════════════════════════
   SIDEBAR — SITES
═══════════════════════════════════════════════════ */
function renderSites() {
  const el = document.getElementById("siteList");
  el.innerHTML = "";
  state.sites.forEach(s => {
    const row = document.createElement("div");
    row.className = "tag-row";
    row.innerHTML = `
      <span class="site-icon">${s.icon || "📍"}</span>
      <span class="tag-name">${escHtml(s.name)}</span>
      <button class="tag-del" title="Delete site" onclick="deleteSite('${s.id}')">&#x2715;</button>
    `;
    el.appendChild(row);
  });

  // Update filter dropdown
  const fs = document.getElementById("filterSite");
  const fsVal = fs.value;
  fs.innerHTML = '<option value="">All sites</option>';
  state.sites.forEach(s => {
    const o = document.createElement("option");
    o.value = s.id; o.textContent = s.name;
    fs.appendChild(o);
  });
  fs.value = fsVal;
}

function addSite() {
  const inp = document.getElementById("newSiteName");
  const name = inp.value.trim();
  if (!name) return;
  state.sites.push({ id: uid(), name, icon: "📍" });
  inp.value = "";
  saveState(); renderSidebar(); renderGrid();
  toast(`Site "${name}" added.`);
}

function deleteSite(id) {
  const s = siteById(id);
  if (!s) return;
  if (!confirm(`Delete site "${s.name}"? All bookings for this site will be cleared.`)) return;
  state.sites = state.sites.filter(x => x.id !== id);
  Object.keys(state.bookings).forEach(k => {
    if (k.startsWith(id + "|")) delete state.bookings[k];
  });
  saveState(); renderSidebar(); renderGrid();
  toast(`Site "${s.name}" deleted.`);
}

/* ═══════════════════════════════════════════════════
   SIDEBAR — STATS & CONFLICTS
═══════════════════════════════════════════════════ */
function renderStats() {
  const total = Object.keys(state.bookings).length;
  const numWeeks = parseInt(document.getElementById("numWeeks").value) || state.numWeeks;
  const totalSlots = state.sites.length * numWeeks * 7 * SESSIONS.length;
  const pct = totalSlots > 0 ? Math.round(total / totalSlots * 100) : 0;
  document.getElementById("stats").innerHTML = `
    <div class="stat-box"><div class="stat-val">${state.sites.length}</div><div class="stat-lbl">Sites</div></div>
    <div class="stat-box"><div class="stat-val">${state.groups.length}</div><div class="stat-lbl">Groups</div></div>
    <div class="stat-box"><div class="stat-val">${total}</div><div class="stat-lbl">Bookings</div></div>
    <div class="stat-box"><div class="stat-val">${pct}%</div><div class="stat-lbl">Utilization</div></div>
  `;
}

function renderConflicts() {
  // Detect: same group, same day+session, multiple sites (not really conflict) OR
  // same site, same day+session, multiple groups (impossible by design — one cell = one group)
  // Meaningful conflict: same group double-booked at same day+session across different sites
  const byGroupSlot = {}; // groupId|dayIdx|session -> [siteIds]
  Object.entries(state.bookings).forEach(([key, val]) => {
    const [siteId, dayIdx, session] = key.split("|");
    const gkey = `${val.groupId}|${dayIdx}|${session}`;
    if (!byGroupSlot[gkey]) byGroupSlot[gkey] = [];
    byGroupSlot[gkey].push(siteId);
  });

  const conflicts = [];
  Object.entries(byGroupSlot).forEach(([gkey, sites]) => {
    if (sites.length > 1) {
      const [groupId, dayIdx, session] = gkey.split("|");
      const g = groupById(groupId);
      if (!g) return;
      const date = addDays(state.weekStart, parseInt(dayIdx));
      const siteNames = sites.map(id => siteById(id)?.name || "?").join(", ");
      conflicts.push(`<div class="conflict-item">
        ⚠️ <strong>${escHtml(g.name)}</strong> double-booked on
        ${fmtDate(date)} ${session}:<br>${escHtml(siteNames)}
      </div>`);
    }
  });

  const el = document.getElementById("conflictList");
  if (conflicts.length === 0) {
    el.innerHTML = `<div style="font-size:.75rem;color:var(--muted)">No conflicts detected.</div>`;
  } else {
    el.innerHTML = conflicts.join("");
  }
}

function renderSidebar() {
  renderGroups();
  renderSites();
  renderStats();
  renderConflicts();
}

/* ═══════════════════════════════════════════════════
   MAIN GRID
═══════════════════════════════════════════════════ */
function buildDays() {
  const numWeeks = parseInt(document.getElementById("numWeeks")?.value) || state.numWeeks;
  const weekStart = document.getElementById("weekStart")?.value || state.weekStart;
  const days = [];
  for (let i = 0; i < numWeeks * 7; i++) {
    days.push(addDays(weekStart, i));
  }
  return days;
}

function renderGrid() {
  const filterGroup = document.getElementById("filterGroup").value;
  const filterSite  = document.getElementById("filterSite").value;
  const numWeeks    = parseInt(document.getElementById("numWeeks").value);
  state.weekStart   = document.getElementById("weekStart").value || state.weekStart;
  state.numWeeks    = numWeeks;

  const days = buildDays();
  const sites = filterSite
    ? state.sites.filter(s => s.id === filterSite)
    : state.sites;

  const tbl = document.getElementById("grid");
  tbl.innerHTML = "";

  /* ── Column headers ── */
  // Week row
  const weekRow = tbl.insertRow();
  const cornerCell = weekRow.insertCell();
  cornerCell.className = "col-site";
  cornerCell.rowSpan = 2;
  cornerCell.style.verticalAlign = "middle";
  cornerCell.innerHTML = `<span style="font-size:.7rem;color:var(--muted)">SITE / FACILITY</span>`;

  // Group weeks
  const weekMap = {};
  days.forEach((d, i) => {
    const wk = Math.floor(i / 7);
    if (!weekMap[wk]) weekMap[wk] = { start: d, count: 0 };
    weekMap[wk].count++;
  });
  Object.values(weekMap).forEach(w => {
    const th = document.createElement("th");
    th.colSpan = w.count * SESSIONS.length;
    th.textContent = `Week of ${fmtDate(w.start)}`;
    weekRow.appendChild(th);
  });

  // Day + session row
  const dayRow = tbl.createTHead().insertRow();
  const c2 = dayRow.insertCell();
  c2.className = "col-site";
  c2.style.display = "none"; // covered by rowSpan above; keep in DOM for sticky

  days.forEach((d, i) => {
    SESSIONS.forEach((sess, si) => {
      const th = document.createElement("th");
      th.innerHTML = `
        <div style="font-weight:700">${DAY_LABELS[i % 7]}</div>
        <div style="font-size:.65rem;color:var(--muted)">${fmtDate(d)}</div>
        <div style="font-size:.62rem;color:var(--muted);font-weight:400">${sess.slice(0,3)}</div>
      `;
      th.style.minWidth = "78px";
      dayRow.appendChild(th);
    });
  });

  /* ── Body rows ── */
  const tbody = document.createElement("tbody");
  tbl.appendChild(tbody);

  sites.forEach(site => {
    const tr = tbody.insertRow();

    // Site label
    const siteTd = tr.insertCell();
    siteTd.className = "col-site";
    siteTd.innerHTML = `
      <span style="font-size:.9rem;margin-right:5px">${site.icon || "📍"}</span>
      <span style="font-weight:600">${escHtml(site.name)}</span>
    `;

    // Cells
    days.forEach((d, dayIdx) => {
      SESSIONS.forEach(sess => {
        const key = slotKey(site.id, dayIdx, sess);
        const booking = state.bookings[key];
        const group = booking ? groupById(booking.groupId) : null;

        // Filter: if filtering by group and this cell isn't that group, dim it
        const dimmed = filterGroup && booking && booking.groupId !== filterGroup;
        const hidden = filterGroup && !booking;

        const td = tr.insertCell();
        td.className = "cell";
        if (booking && !dimmed) td.classList.add("booked");

        // Conflict highlight (same group double-booked same slot)
        if (booking && isConflict(booking.groupId, dayIdx, sess, site.id)) {
          td.classList.add("conflict");
        }

        const opacity = dimmed ? "0.15" : hidden ? "0.4" : "1";
        td.style.opacity = opacity;

        let inner = "";
        if (group && !dimmed) {
          const rgb = hexToRgb(group.color);
          inner = `
            <div class="cell-bg" style="background:rgb(${rgb});opacity:.15"></div>
            <div class="cell-content" style="color:${group.color}">
              <div class="cell-group">${escHtml(group.name)}</div>
              ${booking.activity ? `<div class="cell-activity">${escHtml(booking.activity)}</div>` : ""}
            </div>
          `;
        } else {
          inner = `<div class="cell-content"><span class="empty-cell">+</span></div>`;
        }
        td.innerHTML = inner;
        td.addEventListener("click", () => openModal(site.id, dayIdx, sess, d));
      });
    });
  });

  renderSidebar();
  saveState();
}

function isConflict(groupId, dayIdx, sess, excludeSiteId) {
  return Object.entries(state.bookings).some(([key, val]) => {
    if (val.groupId !== groupId) return false;
    const [siteId, dIdx, s] = key.split("|");
    return siteId !== excludeSiteId && parseInt(dIdx) === dayIdx && s === sess;
  });
}

/* ═══════════════════════════════════════════════════
   MODAL
═══════════════════════════════════════════════════ */
let _modalKey = null;

function openModal(siteId, dayIdx, session, date) {
  _modalKey = slotKey(siteId, dayIdx, session);
  const site = siteById(siteId);
  const booking = state.bookings[_modalKey];

  document.getElementById("modalTitle").textContent =
    `${site?.icon || "📍"} ${site?.name} — ${DAY_LABELS[dayIdx % 7]}, ${fmtDate(date)} ${session}`;

  document.getElementById("slotInfo").innerHTML = `
    <span class="lbl">Site</span><span>${escHtml(site?.name || "")}</span>
    <span class="lbl">Date</span><span>${fmtDate(date)}, ${session}</span>
  `;

  // Populate group dropdown
  const sel = document.getElementById("modalGroup");
  sel.innerHTML = '<option value="">(empty — clear slot)</option>';
  state.groups.forEach(g => {
    const o = document.createElement("option");
    o.value = g.id; o.textContent = g.name;
    if (booking && booking.groupId === g.id) o.selected = true;
    sel.appendChild(o);
  });

  document.getElementById("modalActivity").value = booking?.activity || "";
  document.getElementById("modalClear").style.display = booking ? "" : "none";

  document.getElementById("cellModal").style.display = "flex";
  setTimeout(() => document.getElementById("modalGroup").focus(), 50);
}

function closeModal() {
  document.getElementById("cellModal").style.display = "none";
  _modalKey = null;
}

function saveSlot() {
  if (!_modalKey) return;
  const groupId = document.getElementById("modalGroup").value;
  const activity = document.getElementById("modalActivity").value.trim();

  if (groupId) {
    state.bookings[_modalKey] = { groupId, activity };
  } else {
    delete state.bookings[_modalKey];
  }

  closeModal();
  saveState();
  renderGrid();
  toast(groupId ? "Slot saved!" : "Slot cleared.");
}

function clearSlot() {
  if (!_modalKey) return;
  delete state.bookings[_modalKey];
  closeModal();
  saveState();
  renderGrid();
  toast("Slot cleared.");
}

/* ═══════════════════════════════════════════════════
   EXPORT CSV
═══════════════════════════════════════════════════ */
function exportCSV() {
  const days = buildDays();
  const rows = [];

  // Header
  const hdr = ["Site"];
  days.forEach((d, i) => {
    SESSIONS.forEach(sess => {
      hdr.push(`${DAY_LABELS[i % 7]} ${fmtDate(d)} ${sess}`);
    });
  });
  rows.push(hdr);

  state.sites.forEach(site => {
    const row = [site.name];
    days.forEach((d, dayIdx) => {
      SESSIONS.forEach(sess => {
        const key = slotKey(site.id, dayIdx, sess);
        const booking = state.bookings[key];
        if (booking) {
          const g = groupById(booking.groupId);
          row.push(booking.activity ? `${g?.name}: ${booking.activity}` : (g?.name || ""));
        } else {
          row.push("");
        }
      });
    });
    rows.push(row);
  });

  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "camp-site-usage.csv";
  a.click(); URL.revokeObjectURL(url);
  toast("CSV exported!");
}

/* ═══════════════════════════════════════════════════
   RESET
═══════════════════════════════════════════════════ */
function resetAll() {
  if (!confirm("Reset ALL bookings? Groups and sites will remain.")) return;
  state.bookings = {};
  saveState(); renderGrid();
  toast("All bookings cleared.");
}

/* ═══════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════ */
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2500);
}

/* ═══════════════════════════════════════════════════
   SECURITY HELPER
═══════════════════════════════════════════════════ */
function escHtml(s) {
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

/* ═══════════════════════════════════════════════════
   KEYBOARD SHORTCUTS
═══════════════════════════════════════════════════ */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
  if ((e.key === "Enter") && document.getElementById("cellModal").style.display !== "none") {
    e.preventDefault(); saveSlot();
  }
  if (e.key === "Enter" && document.activeElement === document.getElementById("newGroupName")) {
    e.preventDefault(); addGroup();
  }
  if (e.key === "Enter" && document.activeElement === document.getElementById("newSiteName")) {
    e.preventDefault(); addSite();
  }
});

/* ═══════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════ */
document.getElementById("weekStart").value = state.weekStart;
document.getElementById("numWeeks").value = state.numWeeks;
renderSidebar();
renderGrid();
</script>
